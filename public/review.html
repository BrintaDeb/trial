<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave a Review - Atelier Studios</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=DM+Sans:wght@400;500;700&family=Titan+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/main.css">
    <style>
        .review-container { padding: 6rem 5% 4rem; display: flex; justify-content: center; position: relative; z-index: 10; }
        .review-card { width: 100%; max-width: 600px; padding: 3rem 2rem; text-align: center; }
        
        .form-group { margin-bottom: 1.5rem; text-align: left;}
        .form-group label { display: block; margin-bottom: 0.5rem; color: var(--text-secondary); font-weight: 500; }
        .form-group input, .form-group textarea { width: 100%; padding: 1rem; border-radius: 12px; background: rgba(0, 0, 0, 0.2); border: 1px solid var(--glass-border); color: var(--text-primary); font-family: inherit; outline: none; transition: border-color 0.3s; }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--accent-secondary); }
        
        /* Interactive Star Rating */
        .stars { display: flex; justify-content: center; gap: 0.5rem; flex-direction: row-reverse; margin: 2rem 0; position: relative; }
        .stars input { display: none; }
        .stars label { font-size: 3rem; color: rgba(255,255,255,0.1); cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        
        /* The magic of CSS sibling selectors for stars */
        .stars label:hover,
        .stars label:hover ~ label,
        .stars input:checked ~ label {
            color: #f59e0b;
            text-shadow: 0 0 20px rgba(245, 158, 11, 0.8), 0 0 40px rgba(245, 158, 11, 0.4);
            transform: scale(1.1);
        }

        /* Ultimate 5-star reaction */
        #star5:checked ~ label {
            animation: pulse-glow 1s infinite alternate;
        }

        @keyframes pulse-glow {
            from { text-shadow: 0 0 20px rgba(245, 158, 11, 0.8), 0 0 40px rgba(245, 158, 11, 0.4); }
            to { text-shadow: 0 0 30px rgba(245, 158, 11, 1), 0 0 60px rgba(245, 158, 11, 0.8), 0 0 90px rgba(245, 158, 11, 0.6); transform: scale(1.15); }
        }

        /* Custom File Upload */
        .file-upload-wrapper { position: relative; width: 100%; height: 120px; border: 2px dashed var(--glass-highlight); border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s; background: rgba(255,255,255,0.02); overflow: hidden; }
        .file-upload-wrapper:hover { border-color: var(--accent-secondary); background: rgba(236, 72, 153, 0.1); }
        .file-upload-wrapper input[type="file"] { position: absolute; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .file-upload-text { color: var(--text-secondary); pointer-events: none; display: flex; flex-direction: column; align-items: center; }
        .file-upload-text svg { width: 32px; height: 32px; margin-bottom: 0.5rem; color: var(--accent-secondary); }
        
        .success-msg { display: none; color: #10b981; margin-top: 1rem; font-weight: 600; font-size: 1.2rem;}
        
        /* Celebrate animation container */
        #celebration { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; }
    </style>
</head>
<body>
    <div id="tsparticles"></div>
    <div id="celebration"></div>

    <nav class="navbar glass-panel">
        <div class="logo">Atelier Studios<span>.</span></div>
    </nav>

    <div class="review-container">
        <div class="glass-card review-card">
            <h2 class="gradient-text" style="font-size:2.5rem; margin-bottom:0.5rem">Rate Your Experience</h2>
            <p style="color: var(--text-secondary);">We value your feedback. Leave a review and attach a photo update.</p>
            
            <form id="reviewForm">
                <div class="stars">
                    <!-- Reversed for CSS sibling selector logic -->
                    <input type="radio" name="rating" id="star5" value="5" required>
                    <label for="star5">★</label>
                    <input type="radio" name="rating" id="star4" value="4">
                    <label for="star4">★</label>
                    <input type="radio" name="rating" id="star3" value="3">
                    <label for="star3">★</label>
                    <input type="radio" name="rating" id="star2" value="2">
                    <label for="star2">★</label>
                    <input type="radio" name="rating" id="star1" value="1">
                    <label for="star1">★</label>
                </div>

                <div class="form-group">
                    <input type="text" id="name" name="name" required placeholder="Your Name">
                </div>
                
                <div class="form-group">
                    <textarea id="comment" name="comment" rows="4" required placeholder="Tell us about your project..."></textarea>
                </div>
                
                <div class="form-group">
                    <label>Photo Update (Optional)</label>
                    <div class="file-upload-wrapper">
                        <input type="file" id="photo" name="photo" accept="image/*">
                        <div class="file-upload-text" id="fileText">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                            <span>Click or drag a photo here</span>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary glass-btn" style="width: 100%; margin-top: 1rem;">Submit Review</button>
                <div id="successMsg" class="success-msg">Thank you! Your glowing review has been posted.</div>
            </form>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/tsparticles-engine@2.12.0/tsparticles.engine.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles-basic@2.12.0/tsparticles.basic.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        tsParticles.load("tsparticles", { fpsLimit: 60, particles: { color: { value: ["#ec4899", "#6366f1"] }, links: { enable: false }, move: { enable: true, speed: 1, direction: "top", outModes: "out" }, number: { value: 60 }, opacity: { value: 0.2 }, size: { value: { min: 1, max: 4 } } }, detectRetina: true });

        // Update file input text on selection
        document.getElementById('photo').addEventListener('change', function(e) {
            const fileName = e.target.files[0] ? e.target.files[0].name : 'Click or drag a photo here';
            document.querySelector('#fileText span').innerText = fileName;
        });

        // 5 Star Gamification Trigger
        document.getElementById('star5').addEventListener('change', (e) => {
            if(e.target.checked) {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#f59e0b', '#ec4899', '#6366f1']
                });
            }
        });

        // Handle Submission with Multer/FormData
        document.getElementById('reviewForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = document.getElementById('reviewForm');
            const formData = new FormData(form);
            
            try {
                const res = await fetch('/api/reviews', {
                    method: 'POST',
                    body: formData // Browser automatically sets Content-Type to multipart/form-data with boundary
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('successMsg').style.display = 'block';
                    const btn = document.querySelector('.btn');
                    btn.disabled = true;
                    btn.innerText = "Awesome!";
                    // Huge confetti blast on successful review
                    confetti({ particleCount: 200, spread: 100, origin: { y: 0.5 }, zIndex: 10000 });
                }
            } catch (err) { console.error(err); }
        });
    </script>
<script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/bundled/lenis.min.js"></script>
<script>
    const lenis = new Lenis({ duration: 1.2, easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)) });
    function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
    requestAnimationFrame(raf);
</script>
<script src="/scripts/chatbot.js"></script>
</body>
</html>
