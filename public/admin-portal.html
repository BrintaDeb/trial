<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Atelier Studios</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=DM+Sans:wght@400;500;700&family=Titan+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/main.css">
    <style>
        body { padding-top: 100px; }
        .dashboard-container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        
        /* Analytics Grid */
        .analytics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 3rem; }
        .stat-card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); padding: 1.5rem; border-radius: 16px; text-align: center; }
        .stat-card h4 { color: var(--text-secondary); margin-bottom: 0.5rem; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;}
        .stat-card .stat-value { font-size: 2.5rem; font-family: var(--font-header); color: var(--accent-primary); margin: 0; }
        
        /* Tables */
        .table-wrapper { overflow-x: auto; width: 100%; }
        .data-section { background: rgba(0,0,0,0.2); backdrop-filter: blur(10px); border-radius: 20px; padding: 2.5rem; margin-bottom: 3rem; border: 1px solid rgba(255,255,255,0.03); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .data-section h2 { margin-top: 0; margin-bottom: 2rem; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 1rem; font-size: 1.5rem; }
        table { width: 100%; border-collapse: collapse; white-space: nowrap; }
        th, td { padding: 1.5rem 1rem; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.03); }
        th { color: var(--text-secondary); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; font-size: 0.85rem; }
        tbody tr { transition: background 0.3s; }
        tbody tr:hover { background: rgba(255,255,255,0.02); }
        .badge { padding: 0.4rem 0.8rem; border-radius: 6px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;}
        .badge.new { background: rgba(16, 185, 129, 0.15); color: #34d399; }
    </style>
</head>
<body>
    <nav class="site-nav">
        <a href="/" class="logo">ATELIER.</a>
        <div class="nav-links">
            <button id="logoutBtn" class="btn btn-secondary">Logout</button>
        </div>
    </nav>

    <div class="dashboard-container">
        <h1 class="gradient-text" style="font-size: 3rem; margin-bottom: 2rem;">Admin Dashboard</h1>
        
        <!-- Analytics Section -->
        <div class="analytics-grid">
            <div class="stat-card">
                <h4>Page Views</h4>
                <div class="stat-value" id="stat-views">...</div>
            </div>
            <div class="stat-card">
                <h4>Unique Visitors</h4>
                <div class="stat-value" id="stat-visitors">...</div>
            </div>
            <div class="stat-card">
                <h4>Conversion Rate</h4>
                <div class="stat-value" id="stat-conv">...</div>
            </div>
            <div class="stat-card">
                <h4>Active Leads</h4>
                <div class="stat-value" id="stat-leads">...</div>
            </div>
            <div class="stat-card">
                <h4>Est. Pipeline</h4>
                <div class="stat-value" id="stat-rev">...</div>
            </div>
        </div>


        <!-- Leads Section -->
        <div class="data-section">
            <h2>Recent Leads</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Service Requested</th>
                            <th>Budget</th>
                            <th>Status</th>
                            <th>Score</th>
                        </tr>
                    </thead>
                    <tbody id="leadsTableBody">
                        <tr><td colspan="6" style="text-align:center; color: var(--text-secondary);">Loading leads...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <!-- Quotes Section -->
        <div class="data-section">
            <h2>Generated Quotes</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Email</th>
                            <th>Total Retainer</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="quotesTableBody">
                        <tr><td colspan="4" style="text-align:center; color: var(--text-secondary);">Loading quotes...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Authentication Guard & Data Fetching
        async function fetchDashboardData() {
            try {
                // Fetch Analytics
                const resAnalytics = await fetch('/api/analytics');
                if (resAnalytics.status === 401 || resAnalytics.status === 403) {
                    window.location.href = '/login.html'; // Guard
                    return;
                }
                const dataAnalytics = await resAnalytics.json();
                if (dataAnalytics.success) {
                    document.getElementById('stat-views').innerText = dataAnalytics.analytics.pageViews;
                    document.getElementById('stat-visitors').innerText = dataAnalytics.analytics.uniqueVisitors;
                    document.getElementById('stat-conv').innerText = dataAnalytics.analytics.conversionRate;
                    document.getElementById('stat-leads').innerText = dataAnalytics.analytics.activeLeads;
                    document.getElementById('stat-rev').innerText = dataAnalytics.analytics.revenueEstimate;
                }

                // Fetch Leads
                const resLeads = await fetch('/api/leads');
                const dataLeads = await resLeads.json();
                if (dataLeads.success) {
                    const tbody = document.getElementById('leadsTableBody');
                    if (dataLeads.leads.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color: var(--text-secondary);">No leads found.</td></tr>';
                    } else {
                        tbody.innerHTML = dataLeads.leads.map(lead => `
                            <tr>
                                <td>#${lead.id}</td>
                                <td>${lead.name}</td>
                                <td>${lead.projectType}</td>
                                <td>${lead.budget}</td>
                                <td><span class="badge new">${lead.status}</span></td>
                                <td style="color:var(--accent-secondary)">${lead.score} / 100</td>
                            </tr>
                        `).join('');
                    }
                }

                // Fetch Quotes
                const resQuotes = await fetch('/api/quotes');
                const dataQuotes = await resQuotes.json();
                if (dataQuotes.success) {
                    const tbody = document.getElementById('quotesTableBody');
                    if (dataQuotes.quotes.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color: var(--text-secondary);">No quotes generated yet.</td></tr>';
                    } else {
                        tbody.innerHTML = dataQuotes.quotes.map(q => `
                            <tr>
                                <td>#${q.id}</td>
                                <td>${q.email}</td>
                                <td>₹${q.total.toLocaleString()} /mo</td>
                                <td>${q.istTimestamp}</td>
                            </tr>
                        `).join('');
                    }
                }


            } catch (err) {
                console.error("Failed to load dashboard data:", err);
            }
        }


        // Logout
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/login.html';
        });

        // Init
        fetchDashboardData();
    </script>
</body>
</html>
